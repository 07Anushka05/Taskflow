<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Modern Todo App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gradient-to-br from-purple-100 via-pink-450 to-white-100 min-h-screen">
    <div id="reminderBanner"
        class="hidden bg-gradient-to-r from-purple-500 to-pink-500 text-white py-2 px-4 text-sm sm:text-base font-medium text-center fixed top-0 left-0 w-full z-50 shadow-md">
        <button id="closeBannerBtn"
            class="absolute top-1 right-2 text-white hover:text-purple-100 text-xl font-bold focus:outline-none transition-colors">&times;</button>
    </div>

    <div id="dueDateModal"
        class="fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center z-[100] hidden p-4">
        <div
            class="bg-white rounded-lg shadow-xl p-6 sm:p-8 w-full max-w-md transform transition-all scale-95 opacity-0 duration-300 ease-out">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-2xl font-bold text-purple-700 flex items-center gap-2">
                    <i class="fas fa-bell text-purple-500"></i> Due Date Reminders
                </h3>
                <button id="closeModalBtn"
                    class="text-gray-500 hover:text-gray-700 text-3xl leading-none focus:outline-none">&times;</button>
            </div>
            <div id="modalContent" class="text-gray-700 text-base space-y-2">
                <!-- Due tasks will be inserted here -->
            </div>
            <div class="mt-6 text-right">
                <button id="dismissAllModalBtn"
                    class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2 rounded-lg font-medium transition-colors">
                    Dismiss All
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-2xl mx-auto p-4 sm:p-5 md:p-6 animate-fade-in mt-8 sm:mt-10">
        <header class="mb-6 sm:mb-8 text-center transition-all duration-500 hover:scale-[1.02] px-2">
            <div class="text-4xl sm:text-6xl font-extrabold mb-4">
                <span
                    class="bg-gradient-to-r from-purple-600 via-pink-500 to-indigo-500 bg-clip-text text-transparent">TaskFlow
                </span>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-2 transition-all hover:text-purple-600">Your
                Personal Task
                Manager</h1>
            <p
                class="text-gray-600 font-medium bg-gradient-to-r from-purple-50 to-white-100 p-3 rounded-lg inline-block text-sm sm:text-base shadow-sm">
                Organize your day, boost your productivity</p>
        </header>

        <div
            class="bg-gradient-to-br from-white to-purple-50 rounded-xl shadow-lg p-4 sm:p-6 mb-6 transition-all duration-300 hover:shadow-xl border border-purple-100">
            <div class="flex flex-col gap-3 sm:gap-3 md:flex-row md:gap-2">
                <input type="text" id="taskInput" placeholder="Add a new task..."
                    class="flex-1 px-3 py-3 border-2 border-purple-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all shadow-sm"
                    autocomplete="off">
                <select id="prioritySelect"
                    class="px-2 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500 w-full md:w-auto">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
                <input type="date" id="dueDateInput"
                    class="px-2 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500 w-full md:w-auto min-w-fit">
                <button id="addTaskBtn"
                    class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 sm:px-6 sm:py-3 rounded-lg font-medium transition-colors flex items-center justify-center gap-2 w-full md:w-auto shadow-md hover:shadow-lg">
                    <i class="fas fa-plus"></i> Add
                </button>
            </div>
            <div class="mt-4 mb-6">
                <input id="searchInput" type="text" placeholder="Search tasks..."
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 shadow-sm" />
            </div>


        </div>

        <div class="filter-controls flex flex-wrap justify-center gap-3 sm:gap-4 mb-8">
            <!-- Active filter button -->
            <button data-filter="all"
                class="filter-btn px-4 py-2 sm:px-5 sm:py-2.5 rounded-full bg-gradient-to-r from-purple-700 to-indigo-400 text-white transition-all hover:shadow-lg hover:from-purple-500 hover:to-indigo-500 text-sm sm:text-base shadow-md">
                <i class="fas fa-tasks mr-2"></i>All Tasks
            </button>
            <!-- Inactive filter buttons with refined gradients and text colors -->
            <button data-filter="active"
                class="filter-btn px-4 py-2 sm:px-5 sm:py-2.5 rounded-full bg-gradient-to-r from-blue-50 to-purple-50 text-purple-600 transition-all hover:shadow-md border border-purple-100 text-sm sm:text-base hover:from-blue-100 hover:to-purple-100">
                <i class="fas fa-spinner mr-2"></i>Active
            </button>
            <button data-filter="completed"
                class="filter-btn px-4 py-2 sm:px-5 sm:py-2.5 rounded-full bg-gradient-to-r from-green-50 to-emerald-50 text-emerald-600 transition-all hover:shadow-md border border-emerald-100 text-sm sm:text-base hover:from-green-100 hover:to-emerald-100">
                <i class="fas fa-check-circle mr-2"></i>Completed
            </button>
        </div>
        <div
            class="bg-gradient-to-b from-white to-purple-50 rounded-xl shadow-lg overflow-hidden border border-purple-100">
            <div id="taskList" class="divide-y divide-gray-200">
                <!-- Tasks will be added here dynamically -->
            </div>

            <div id="emptyState"
                class="empty-state flex flex-col items-center justify-center py-8 sm:py-16 px-3 sm:px-4 text-center">
                <div
                    class="w-20 h-20 sm:w-24 sm:h-24 bg-purple-100 rounded-full flex items-center justify-center mb-4 sm:mb-6 shadow-inner">
                    <i class="fas fa-clipboard-list text-3xl sm:text-4xl text-purple-500"></i>
                </div>
                <h3 class="text-xl sm:text-2xl font-bold text-gray-800 mb-2 sm:mb-3">No tasks found</h3>
                <p
                    class="text-gray-600 max-w-xs sm:max-w-md bg-purple-50 px-3 py-2 sm:px-4 sm:py-3 rounded-lg text-sm sm:text-base shadow-sm">
                    Add a new task using the input
                    above.</p>
            </div>
        </div>

        <div
            class="task-stats mt-4 px-2 text-xs sm:text-sm text-gray-600 flex flex-col sm:flex-row justify-between items-center gap-2 sm:gap-0">
            <span id="remainingCount">0 tasks remaining</span>
            <button id="clearCompleted" class="text-purple-600 hover:text-purple-800 transition-colors font-medium">
                Clear completed
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
